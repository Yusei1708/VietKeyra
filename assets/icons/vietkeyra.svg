<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C1121F"/>
      <stop offset="50%" stop-color="#780000"/>
      <stop offset="100%" stop-color="#3D0000"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="100%" stop-color="#FFB703"/>
    </linearGradient>
    <linearGradient id="keyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#FFD166" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Base rounded squircle -->
  <rect x="16" y="16" width="224" height="224" rx="52" fill="url(#bgGrad)" filter="url(#shadow)"/>
  <rect x="16" y="16" width="224" height="224" rx="52" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>

  <!-- Keyboard frame outline -->
  <rect x="42" y="44" width="172" height="106" rx="18" fill="url(#keyGrad)" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>

  <!-- Keyboard key rows -->
  <!-- Row 1 keys -->
  <rect x="52" y="56" width="24" height="18" rx="5" fill="rgba(255,255,255,0.18)"/>
  <rect x="82" y="56" width="24" height="18" rx="5" fill="rgba(255,255,255,0.18)"/>
  <rect x="112" y="56" width="24" height="18" rx="5" fill="rgba(255,255,255,0.18)"/>
  <rect x="142" y="56" width="24" height="18" rx="5" fill="rgba(255,255,255,0.18)"/>
  <rect x="172" y="56" width="32" height="18" rx="5" fill="rgba(255,255,255,0.18)"/>

  <!-- Row 2 keys -->
  <rect x="52" y="80" width="30" height="18" rx="5" fill="rgba(255,255,255,0.18)"/>
  <rect x="88" y="80" width="24" height="18" rx="5" fill="rgba(255,255,255,0.18)"/>
  <rect x="118" y="80" width="24" height="18" rx="5" fill="rgba(255,255,255,0.18)"/>
  <rect x="148" y="80" width="24" height="18" rx="5" fill="rgba(255,255,255,0.18)"/>
  <rect x="178" y="80" width="26" height="18" rx="5" fill="rgba(255,255,255,0.18)"/>

  <!-- Spacebar row -->
  <rect x="52" y="104" width="36" height="18" rx="5" fill="rgba(255,255,255,0.18)"/>
  <rect x="94" y="104" width="80" height="18" rx="5" fill="url(#goldGrad)" opacity="0.9"/>
  <rect x="180" y="104" width="24" height="18" rx="5" fill="rgba(255,255,255,0.18)"/>

  <!-- Prominent Central 'V' + Vietnamese Flag Star -->
  <!-- Golden Star -->
  <polygon points="128,142 133,153 145,153 135,160 139,171 128,164 117,171 121,160 111,153 123,153" fill="url(#goldGrad)" filter="url(#glow)"/>

  <!-- Banner text "VIETKEYRA" -->
  <text x="128" y="206" font-family="'JetBrains Mono', 'Segoe UI', system-ui, sans-serif" font-weight="900" font-size="22" text-anchor="middle" fill="#FFFFFF" letter-spacing="4">VIETKEYRA</text>
</svg>
