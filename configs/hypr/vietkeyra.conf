# ==============================================================================
# VietKeyra - Bộ gõ Tiếng Việt cho Linux (Hyprland Configuration)
# ==============================================================================

# Khởi động dịch vụ daemon nhập liệu cùng phiên đăng nhập Hyprland
exec-once = vietkeyra-daemon

# Phím tắt chuyển đổi chế độ Tiếng Việt (VI) / Tiếng Anh (EN)
bind = SUPER, SPACE, exec, vietkeyra-cli toggle

# Phím tắt mở Bảng điều khiển Giao diện đồ họa VietKeyra GUI
bind = SUPER SHIFT, V, exec, vietkeyra-gui
